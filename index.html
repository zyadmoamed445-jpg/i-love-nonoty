<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>

<style>
body{
  margin:0;
  height:100vh;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-family:Arial;
  transition:opacity .8s;
}

input{
  background:none;
  border:none;
  border-bottom:1px solid #555;
  color:white;
  font-size:18px;
  text-align:center;
  padding:10px;
  outline:none;
  width:200px;
}
</style>
</head>

<body>

<input type="password" id="pass" autocomplete="off">

<script>
document.getElementById("pass").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    if(this.value==="6/5/2024"){
      document.body.style.opacity="0";
      setTimeout(()=>{location.href="surprise.html"},800);
    }else{
      this.value="";
    }
  }
});
</script>

</body>
</html>
