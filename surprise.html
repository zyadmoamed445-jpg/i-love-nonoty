<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🎁 Surprise</title>
<style>
body{
  margin:0; background:linear-gradient(180deg,#12002f,#000);
  color:white; font-family:Arial; text-align:center;
}
h1{
  color:#ff4dd2; margin-top:20px;
  animation: float 2.5s infinite ease-in-out;
}
@keyframes float{ 0%{transform:translateY(0)} 50%{transform:translateY(-8px)} 100%{transform:translateY(0)} }
.name{
  font-size:26px; color:#ffd1f3; margin:10px 0;
  animation: pop 1.2s ease-out;
}
@keyframes pop{ from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
.gift{ font-size:70px; cursor:pointer; transition:.3s }
.gift.open{ transform:scale(1.1) }
p{ width:90%; margin:10px auto 20px; font-size:18px }
img{ width:90%; max-width:300px; border-radius:20px; margin:10px 0 }
audio{ width:90%; margin:12px 0 }
.hidden{ display:none }
</style>
</head>

<body>
<h1>🎄 Merry Christmas 🎄</h1>
<div class="name">Nonoty 💕</div>

<div id="gift" class="gift" onclick="openGift()">🎁</div>

<div id="content" class="hidden">
  <p>
    دي رسالة من قلبي ❤️  
    كل سنة وانتِ طيبة، وأجمل حاجة حصلت في حياتي ✨
  </p>

  <h3>🎵 أغنية</h3>
  <audio controls autoplay>
    <source src="يوم ما اتقابلنا.mp3">
  </audio>

  <h3>📸 صور</h3>
  <img src="IMG-20250215-WA0016.jpg">
  <img src="IMG-20250407-WA0051.jpg">
  <img src="IMG-20250929-WA0008.jpg">
</div>

<script>
function openGift(){
  document.getElementById('gift').classList.add('open');
  document.getElementById('gift').innerText='🎉';
  setTimeout(()=>{
    document.getElementById('content').classList.remove('hidden');
  },400);
}
</script>
</body>
</html>
