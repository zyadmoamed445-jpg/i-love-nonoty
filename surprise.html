<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> </title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}

.section{
  opacity:0;
  transform:translateY(25px);
  transition:1s;
  margin:40px 0;
}

.show{
  opacity:1;
  transform:translateY(0);
}

p{
  width:85%;
  margin:auto;
  font-size:17px;
  line-height:1.8;
}

img{
  width:85%;
  max-width:300px;
  border-radius:18px;
}

audio{display:none}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="يوم ما اتقابلنا.mp3">
</audio>

<div class="section">
  <p>
    من غير مقدمات  
    وجودك في حياتي فرق كل حاجة 🤍
  </p>
</div>

<div class="section">
  <img src="IMG-20250215-WA0016.jpg">
</div>

<div class="section">
  <img src="IMG-20250407-WA0051.jpg">
</div>

<div class="section">
  <img src="IMG-20250929-WA0008.jpg">
</div>

<div class="section">
  <p>
    كل سنة وانتِ الأجمل  
    والأقرب  
    والأهم ✨
  </p>
</div>

<script>
let sections=document.querySelectorAll(".section");
let i=0;
setInterval(()=>{
  if(i<sections.length){
    sections[i].classList.add("show");
    i++;
  }
},1300);
</script>

</body>
</html>
